<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white flex flex-col min-h-screen">

                <!-- Brand Logo -->

                        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-display font-extrabold text-xl tracking-tight text-slate-900 leading-none">Pasar<span class="text-emerald-600">Kita</span></span>

                <!-- Primary Navigation Links (Desktop) -->

    <!-- FOOTER GLOBAL -->
    <footer class="bg-slate-900 text-slate-300 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">

                    <div class="flex items-center gap-2.5">

                <div>

                        <li><button onclick="navigateTo('home')" class="hover:text-emerald-400">1. Homepage Customer</button></li>

                <p>&copy; 2026 PasarKita E-Commerce System. Powered by Supabase & Tailwind CSS.</p>
                <div class="flex items-center gap-3">
                    <button onclick="navigateTo('database')" class="text-emerald-400 hover:underline font-medium">Buka Database Inspector</button>
                </div>

        </div>

    <!-- JAVASCRIPT ENGINE & SUPABASE INTEGRATION -->
    <script>
        // KREDENSIAL SUPABASE
        const SUPABASE_URL = 'https://lwhgwbvguyopdkylzpju.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_3zyhSIybf4XHJT836IeGyA_4PFf0BsR';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const DEFAULT_USERS = [
            { id: 'USR-001', name: 'Budi Santoso', email: 'budi@pasarkita.id', password: '123', role: 'customer', phone: '0812-3456-7890', address: 'Jl. Margonda Raya No. 88, Beji' },
            { id: 'USR-002', name: 'Admin Toko PasarKita', email: 'admin@pasarkita.id', password: '123', role: 'admin', phone: '0811-9999-0000', address: 'Menara PasarKita Lt. 12, Sudirman' }
        ];

        const DEFAULT_PRODUCTS = [
            { id: 'PRD-101', name: 'Sony WH-1000XM5 Wireless Headphone', category: 'Elektronik', price: 4299000, original_price: 5499000, stock: 15, sold: 142, condition: 'Baru', rating: 4.9, seller: 'Sony Audio Official', location: 'Jakarta Selatan', is_flash_sale: true, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80', description: 'Headphone nirkabel flagship dengan Active Noise Cancelling.' },
            { id: 'PRD-102', name: 'Sepatu Lari AeroRun Ultralight Emerald', category: 'Fashion', price: 489000, original_price: 750000, stock: 28, sold: 310, condition: 'Baru', rating: 4.8, seller: 'AeroSport Indonesia', location: 'Bandung', is_flash_sale: true, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80', description: 'Sepatu lari jarak jauh dengan midsole empuk.' },
            { id: 'PRD-103', name: 'Kopi Arabika Gayo Wine Single Origin 500g', category: 'Kuliner & Snack', price: 135000, original_price: 175000, stock: 40, sold: 520, condition: 'Baru', rating: 4.9, seller: 'Roastery Nusantara', location: 'Banda Aceh', is_flash_sale: true, image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=800&q=80', description: 'Biji kopi Arabika pilihan dari ketinggian 1.600 mdpl Aceh Gayo.' },
            { id: 'PRD-104', name: 'Mechanical Keyboard Wireless 75%', category: 'Hobi & Gaming', price: 849000, original_price: 1150000, stock: 12, sold: 98, condition: 'Baru', rating: 4.9, seller: 'KeyCraft Studio', location: 'Jakarta Barat', is_flash_sale: true, image: 'https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=800&q=80', description: 'Keyboard mekanikal kustom gasket mount.' }
        ];

        // DATABASE LAYER (SUPABASE + LOCALSTORAGE CACHE)
        const DB = {
            async init() {
                try {
                    const { data: prods } = await supabaseClient.from('products').select('*');
                    if (!prods || prods.length === 0) {
                        await supabaseClient.from('products').insert(DEFAULT_PRODUCTS);
                    }
                    const { data: usrs } = await supabaseClient.from('users').select('*');
                    if (!usrs || usrs.length === 0) {
                        await supabaseClient.from('users').insert(DEFAULT_USERS);
                    }
                    if (!localStorage.getItem('pasarkita_db_cart_v1')) {
                        localStorage.setItem('pasarkita_db_cart_v1', JSON.stringify([{ productId: 'PRD-101', qty: 1, selected: true }]));
                    }
                    if (!localStorage.getItem('pasarkita_db_session_v1')) {
                        localStorage.setItem('pasarkita_db_session_v1', JSON.stringify(DEFAULT_USERS[0]));
                    }
                } catch (err) {
                    console.error('Gagal inisialisasi Supabase:', err);
                }
            },

            async getUsers() {
                const { data, error } = await supabaseClient.from('users').select('*');
                return error ? [] : data;
            },

            async getProducts() {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) return [];
                return data.map(p => ({
                    id: p.id,
                    name: p.name,
                    category: p.category,
                    price: p.price,
                    originalPrice: p.original_price,
                    stock: p.stock,
                    sold: p.sold,
                    condition: p.condition,
                    rating: p.rating,
                    seller: p.seller,
                    location: p.location,
                    isFlashSale: p.is_flash_sale,
                    image: p.image,
                    description: p.description
                }));
            },

            async getTransactions() {
                const { data, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
                if (error) return [];
                return data.map(t => ({
                    invoice: t.invoice,
                    userId: t.user_id,
                    customerName: t.customer_name,
                    phone: t.phone,
                    shippingAddress: t.shipping_address,
                    shippingMethod: t.shipping_method,
                    paymentMethod: t.payment_method,
                    items: t.items,
                    subtotal: t.subtotal,
                    shippingCost: t.shipping_cost,
                    discount: t.discount,
                    total: t.total,
                    status: t.status,
                    createdAt: t.created_at
                }));
            },

            async saveTransaction(tx) {
                await supabaseClient.from('transactions').insert({
                    invoice: tx.invoice,
                    user_id: tx.userId,
                    customer_name: tx.customerName,
                    phone: tx.phone,
                    shipping_address: tx.shippingAddress,
                    shipping_method: tx.shippingMethod,
                    payment_method: tx.paymentMethod,
                    items: tx.items,
                    subtotal: tx.subtotal,
                    shipping_cost: tx.shippingCost,
                    discount: tx.discount,
                    total: tx.total,
                    status: tx.status,
                    created_at: tx.createdAt
                });
            },

            getCart() { return JSON.parse(localStorage.getItem('pasarkita_db_cart_v1') || '[]'); },
            saveCart(data) { localStorage.setItem('pasarkita_db_cart_v1', JSON.stringify(data)); updateNavbarState(); },

            getSession() {
                const raw = localStorage.getItem('pasarkita_db_session_v1');
                return raw ? JSON.parse(raw) : null;
            },
            saveSession(user) {
                if (user) localStorage.setItem('pasarkita_db_session_v1', JSON.stringify(user));
                else localStorage.removeItem('pasarkita_db_session_v1');
                updateNavbarState();
            }
        };

        // APPLICATION STATE & VIEW ROUTER
        let state = {
            currentView: 'home',
            selectedProductId: null,
            detailQty: 1,
            catalogSearch: '',
            catalogCategory: 'Semua',
            catalogCondition: 'Semua',
            appliedVoucher: null,
            shippingMethod: 'reguler',
            paymentMethod: 'Transfer Bank BCA',
            authTab: 'login',
            customerTab: 'orders',
            adminTab: 'products',
            editingProductId: null,
            dbTab: 'transactions'
        };

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num || 0);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-rose-950 border-rose-700 text-rose-100' : 'bg-slate-900 border-slate-700 text-white';
            const dotColor = type === 'error' ? 'bg-rose-400' : 'bg-emerald-400';
            toast.className = `${colors} px-4 py-3 rounded-xl shadow-xl border text-xs sm:text-sm font-medium flex items-center gap-2.5 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto max-w-sm`;
            toast.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getStatusBadge(status) {
            const map = {
                'Menunggu Pembayaran': 'bg-amber-50 text-amber-700 border-amber-200',
                'Diproses': 'bg-blue-50 text-blue-700 border-blue-200',
                'Dikirim': 'bg-purple-50 text-purple-700 border-purple-200',
                'Selesai': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'Dibatalkan': 'bg-rose-50 text-rose-700 border-rose-200'
            };
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${map[status] || 'bg-slate-100 text-slate-700 border-slate-200'}">${status}</span>`;
        }

        async function navigateTo(view, params = {}) {
            state.currentView = view;
            if (params.productId) { state.selectedProductId = params.productId; state.detailQty = 1; }
            if (params.category) state.catalogCategory = params.category;
            if (params.authTab) state.authTab = params.authTab;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateNavbarState();
            await renderCurrentView();
        }

        function updateNavbarState() {
            document.querySelectorAll('.nav-link').forEach(el => {
                const target = el.dataset.nav;
                if (target === state.currentView) {
                    el.classList.add('bg-white', 'text-emerald-700', 'shadow-2xs');
                    el.classList.remove('text-slate-600');
                } else {
                    el.classList.remove('bg-white', 'text-emerald-700', 'shadow-2xs');
                    el.classList.add('text-slate-600');
                }
            });

            const cart = DB.getCart();
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('nav-cart-badge');
            if (badge) badge.textContent = totalQty;

            const session = DB.getSession();
            const authArea = document.getElementById('nav-auth-area');
            if (authArea) {
                if (session) {
                    authArea.innerHTML = `
                        <div class="flex items-center gap-2">
                            <button onclick="navigateTo('customer-dashboard')" class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl hover:bg-slate-100 transition-colors text-left">
                                <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-xs">
                                    ${session.name.charAt(0)}
                                </div>
                                <div class="hidden xl:flex flex-col">
                                    <span class="text-xs font-bold text-slate-900 leading-tight">${session.name.split(' ')[0]}</span>
                                    <span class="text-[10px] text-emerald-600 font-medium uppercase">${session.role}</span>
                                </div>
                            </button>
                            <button onclick="handleLogout()" title="Keluar Akun" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition-colors">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                } else {
                    authArea.innerHTML = `
                        <div class="flex items-center gap-1.5">
                            <button onclick="navigateTo('auth', {authTab: 'login'})" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:text-emerald-600">Masuk</button>
                            <button onclick="navigateTo('auth', {authTab: 'register'})" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm">Daftar</button>
                        </div>
                    `;
                }
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        async function quickSwitchAdmin() {
            const users = await DB.getUsers();
            const admin = users.find(u => u.role === 'admin') || users[1];
            DB.saveSession(admin);
            showToast('Beralih ke mode Admin Toko (Supabase)');
            navigateTo('admin-dashboard');
        }

        function handleLogout() {
            DB.saveSession(null);
            showToast('Berhasil keluar akun');
            navigateTo('home');
        }

        function handleGlobalSearch(query) {
            state.catalogSearch = query;
            navigateTo('catalog');
        }

        // VIEW RENDERERS DISPATCHER
        async function renderCurrentView() {
            const root = document.getElementById('app-root');
            if (!root) return;

            switch (state.currentView) {
                case 'home': root.innerHTML = await renderHomeView(); break;
                case 'catalog': root.innerHTML = await renderCatalogView(); break;
                case 'product-detail': root.innerHTML = await renderProductDetailView(); break;
                case 'cart': root.innerHTML = await renderCartView(); break;
                case 'checkout': root.innerHTML = await renderCheckoutView(); break;
                case 'auth': root.innerHTML = renderAuthView(); break;
                case 'customer-dashboard': root.innerHTML = await renderCustomerDashboardView(); break;
                case 'admin-dashboard': root.innerHTML = await renderAdminDashboardView(); break;
                case 'database': root.innerHTML = await renderDatabaseView(); break;
                default: root.innerHTML = await renderHomeView(); break;
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // 1. HOME VIEW
        async function renderHomeView() {
            const products = await DB.getProducts();
            const flashSales = products.filter(p => p.isFlashSale);

            return `
                <div class="space-y-10 pb-16">
                    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
                        <div class="relative rounded-3xl bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white overflow-hidden shadow-2xl p-8 sm:p-12 flex flex-col md:flex-row items-center justify-between gap-8">
                            <div class="relative z-10 max-w-xl space-y-4 text-center md:text-left">
                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-semibold">
                                    <i data-lucide="cloud" class="w-3.5 h-3.5"></i> Terhubung ke Supabase Cloud DB
                                </div>
                                <h1 class="font-display font-extrabold text-3xl sm:text-5xl tracking-tight leading-tight">
                                    Belanja <span class="text-emerald-400">E-Commerce Fullstack</span> via Supabase
                                </h1>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                    Data katalog, user, dan transaksi kini tersimpan aman di database relasional PostgreSQL cloud.
                                </p>
                                <div class="pt-2 flex flex-wrap items-center justify-center md:justify-start gap-3">
                                    <button onclick="navigateTo('catalog')" class="px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-display font-bold text-xs shadow-lg">Jelajahi Katalog</button>
                                    <button onclick="quickSwitchAdmin()" class="px-6 py-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 text-white font-display font-bold text-xs">Panel Admin</button>
                                </div>
                            </div>
                            <div class="relative z-10 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl border border-white/10">
                                <img src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-64 object-cover">
                            </div>
                        </div>
                    </section>

                    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-rose-500 text-white flex items-center justify-center font-bold text-xs">⚡</div>
                                <h2 class="font-display font-bold text-lg sm:text-xl text-slate-900">Flash Sale Cloud</h2>
                            </div>
                            <button onclick="navigateTo('catalog')" class="text-xs font-bold text-emerald-600 hover:underline">Lihat Katalog</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                            ${flashSales.map(p => renderProductCard(p)).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderProductCard(p) {
            const disc = p.originalPrice > p.price ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
            return `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-lg transition-all overflow-hidden flex flex-col group">
                    <div class="relative aspect-square overflow-hidden bg-slate-100">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        ${disc > 0 ? `<span class="absolute top-3 left-3 px-2 py-1 rounded-lg bg-rose-500 text-white text-[10px] font-bold">-${disc}%</span>` : ''}
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div class="space-y-1">
                            <span class="text-[10px] font-semibold text-emerald-600 uppercase tracking-wider">${p.category}</span>
                            <h3 onclick="navigateTo('product-detail', {productId: '${p.id}'})" class="font-display font-bold text-xs sm:text-sm text-slate-900 line-clamp-2 cursor-pointer hover:text-emerald-600">${p.name}</h3>
                        </div>
                        <div class="space-y-2">
                            <div class="font-display font-extrabold text-sm sm:text-base text-slate-900">${formatRupiah(p.price)}</div>
                            <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-[11px] text-slate-500">
                                <span class="flex items-center gap-1"><i data-lucide="star" class="w-3.5 h-3.5 text-amber-500 fill-amber-500"></i> ${p.rating} (${p.sold})</span>
                                <button onclick="addToCart('${p.id}', 1)" class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-600 hover:text-white text-emerald-700 font-semibold transition-colors">+ Keranjang</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. CATALOG VIEW
        async function renderCatalogView() {
            const products = await DB.getProducts();
            const categories = ['Semua', ...new Set(products.map(p => p.category))];

            const filtered = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(state.catalogSearch.toLowerCase()) || p.category.toLowerCase().includes(state.catalogSearch.toLowerCase());
                const matchCat = state.catalogCategory === 'Semua' || p.category === state.catalogCategory;
                const matchCond = state.catalogCondition === 'Semua' || p.condition === state.catalogCondition;
                return matchSearch && matchCat && matchCond;
            });

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                        <div>
                            <h1 class="font-display font-extrabold text-xl text-slate-900">Katalog Produk Supabase</h1>
                            <p class="text-xs text-slate-500 mt-0.5">Menampilkan ${filtered.length} produk dari database cloud.</p>
                        </div>
                        <input type="text" placeholder="Cari produk..." value="${state.catalogSearch}" oninput="state.catalogSearch = this.value; renderCurrentView();" class="px-3.5 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-emerald-500">
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div class="space-y-4">
                            <h3 class="font-display font-bold text-sm text-slate-900 uppercase tracking-wider">Kategori</h3>
                            <div class="flex flex-col space-y-1">
                                ${categories.map(cat => `<button onclick="state.catalogCategory = '${cat}'; renderCurrentView();" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-left transition-colors ${state.catalogCategory === cat ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white hover:bg-slate-100 text-slate-700 border border-slate-200'}">${cat}</button>`).join('')}
                            </div>
                        </div>
                        <div class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                            ${filtered.map(p => renderProductCard(p)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. PRODUCT DETAIL VIEW
        async function renderProductDetailView() {
            const products = await DB.getProducts();
            const p = products.find(prod => prod.id === state.selectedProductId) || products[0];

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <button onclick="navigateTo('catalog')" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-emerald-600"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</button>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-xs">
                        <div class="aspect-square rounded-2xl overflow-hidden bg-slate-100"><img src="${p.image}" class="w-full h-full object-cover"></div>
                        <div class="space-y-6">
                            <h1 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900">${p.name}</h1>
                            <div class="font-display font-extrabold text-2xl text-emerald-600">${formatRupiah(p.price)}</div>
                            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${p.description}</p>
                            <div class="flex items-center gap-4">
                                <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50">
                                    <button onclick="if(state.detailQty>1){state.detailQty--; renderCurrentView();}" class="px-3 py-2 font-bold">-</button>
                                    <span class="px-4 text-xs font-bold">${state.detailQty}</span>
                                    <button onclick="if(state.detailQty<p.stock){state.detailQty++; renderCurrentView();}" class="px-3 py-2 font-bold">+</button>
                                </div>
                                <button onclick="addToCart('${p.id}', state.detailQty)" class="flex-1 py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md">Masukkan Keranjang</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. CART VIEW
        async function addToCart(productId, qty) {
            const cart = DB.getCart();
            const existing = cart.find(i => i.productId === productId);
            if (existing) existing.qty += qty;
            else cart.push({ productId, qty, selected: true });
            DB.saveCart(cart);
            showToast('Produk ditambahkan ke keranjang!');
        }

        async function renderCartView() {
            const cart = DB.getCart();
            const products = await DB.getProducts();
            const items = cart.map(i => ({ ...i, product: products.find(p => p.id === i.productId) })).filter(i => i.product);
            const selected = items.filter(i => i.selected);
            const subtotal = selected.reduce((sum, i) => sum + (i.product.price * i.qty), 0);

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <h1 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900">Keranjang Belanja</h1>
                    ${items.length === 0 ? `<div class="bg-white p-12 rounded-3xl border text-center space-y-4"><h3 class="font-bold">Keranjang Kosong</h3><button onclick="navigateTo('catalog')" class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-xs">Mulai Belanja</button></div>` : `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-4">
                                ${items.map(i => `
                                    <div class="bg-white p-4 rounded-2xl border flex items-center gap-4">
                                        <input type="checkbox" ${i.selected?'checked':''} onchange="let c=DB.getCart(); c.find(x=>x.productId==='${i.productId}').selected=!c.find(x=>x.productId==='${i.productId}').selected; DB.saveCart(c); renderCurrentView();" class="w-4 h-4 text-emerald-600">
                                        <img src="${i.product.image}" class="w-16 h-16 rounded-xl object-cover">
                                        <div class="flex-1"><h3 class="font-bold text-xs">${i.product.name}</h3><div class="font-bold text-sm text-slate-900">${formatRupiah(i.product.price)}</div></div>
                                        <span class="text-xs font-bold">Qty: ${i.qty}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="bg-white p-6 rounded-3xl border shadow-xs space-y-4">
                                <h3 class="font-bold text-sm">Ringkasan</h3>
                                <div class="flex justify-between font-extrabold text-sm pt-2 border-t"><span>Total</span><span>${formatRupiah(subtotal)}</span></div>
                                <button onclick="navigateTo('checkout')" class="w-full py-3 bg-emerald-600 text-white rounded-xl text-xs font-bold">Lanjut Checkout</button>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        // 5. CHECKOUT VIEW
        async function renderCheckoutView() {
            const session = DB.getSession() || (await DB.getUsers())[0];
            const cart = DB.getCart();
            const products = await DB.getProducts();
            const selected = cart.filter(i => i.selected).map(i => ({ ...i, product: products.find(p => p.id === i.productId) })).filter(i => i.product);
            const subtotal = selected.reduce((sum, i) => sum + (i.product.price * i.qty), 0);

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <h1 class="font-display font-extrabold text-xl text-slate-900">Checkout Pengiriman</h1>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 bg-white p-6 rounded-3xl border space-y-4 text-xs">
                            <div><label class="block font-medium mb-1">Nama Penerima</label><input type="text" id="chk-name" value="${session.name}" class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label class="block font-medium mb-1">Alamat</label><textarea id="chk-address" class="w-full px-3 py-2 bg-slate-100 rounded-xl">${session.address || ''}</textarea></div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border space-y-4">
                            <h3 class="font-bold text-sm">Total: ${formatRupiah(subtotal + 12000)}</h3>
                            <button onclick="processCheckout(${subtotal})" class="w-full py-3 bg-emerald-600 text-white rounded-xl text-xs font-bold">Bayar Sekarang</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function processCheckout(subtotal) {
            const session = DB.getSession() || (await DB.getUsers())[0];
            const cart = DB.getCart();
            const products = await DB.getProducts();
            const selected = cart.filter(i => i.selected).map(i => ({
                id: i.productId,
                name: products.find(p => p.id === i.productId)?.name || '',
                price: products.find(p => p.id === i.productId)?.price || 0,
                qty: i.qty,
                image: products.find(p => p.id === i.productId)?.image || ''
            }));

            const newTx = {
                invoice: `INV-SUPA-${Math.floor(1000 + Math.random() * 9000)}`,
                userId: session.id,
                customerName: document.getElementById('chk-name').value,
                phone: '0812345678',
                shippingAddress: document.getElementById('chk-address').value,
                shippingMethod: 'Reguler',
                paymentMethod: 'Transfer BCA',
                items: selected,
                subtotal,
                shippingCost: 12000,
                discount: 0,
                total: subtotal + 12000,
                status: 'Diproses',
                createdAt: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };

            await DB.saveTransaction(newTx);
            DB.saveCart(cart.filter(i => !i.selected));
            showToast('Pesanan berhasil masuk Supabase Database!');
            navigateTo('customer-dashboard');
        }

        // 6. AUTH VIEW
        function renderAuthView() {
            return `
                <div class="max-w-md mx-auto px-4 py-16">
                    <div class="bg-white p-8 rounded-3xl border shadow-xl space-y-6 text-xs">
                        <h1 class="font-extrabold text-xl text-center">Masuk PasarKita</h1>
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div><label class="block mb-1 font-medium">Email</label><input type="email" id="login-email" required class="w-full px-3.5 py-2.5 bg-slate-100 rounded-xl"></div>
                            <div><label class="block mb-1 font-medium">Password</label><input type="password" id="login-password" required class="w-full px-3.5 py-2.5 bg-slate-100 rounded-xl"></div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md">Masuk</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const users = await DB.getUsers();
            const user = users.find(u => u.email === email && u.password === pass);
            if (user) {
                DB.saveSession(user);
                showToast(`Selamat datang, ${user.name}!`);
                navigateTo(user.role === 'admin' ? 'admin-dashboard' : 'home');
            } else {
                showToast('Email atau password salah!', 'error');
            }
        }

        // 7. CUSTOMER DASHBOARD VIEW
        async function renderCustomerDashboardView() {
            const session = DB.getSession() || (await DB.getUsers())[0];
            const transactions = await DB.getTransactions();
            const userTxs = transactions.filter(t => t.userId === session.id);

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <div class="bg-white p-6 rounded-3xl border flex items-center justify-between">
                        <div><h1 class="font-extrabold text-xl">${session.name}</h1><p class="text-xs text-slate-500">${session.email}</p></div>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 text-rose-600 font-semibold text-xs rounded-xl">Keluar</button>
                    </div>
                    <div class="space-y-4">
                        <h2 class="font-bold text-lg">Riwayat Pesanan (Supabase)</h2>
                        ${userTxs.map(t => `
                            <div class="bg-white p-6 rounded-2xl border shadow-xs space-y-3 text-xs">
                                <div class="flex justify-between font-bold"><span>${t.invoice}</span>${getStatusBadge(t.status)}</div>
                                <div class="text-slate-500">Total: ${formatRupiah(t.total)} (${t.createdAt})</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 8. ADMIN DASHBOARD VIEW
        async function renderAdminDashboardView() {
            const products = await DB.getProducts();

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <div class="flex justify-between items-center">
                        <h1 class="font-extrabold text-xl">Admin Dashboard (Supabase)</h1>
                        <button onclick="state.editingProductId = 'new'; renderCurrentView();" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">+ Tambah Produk</button>
                    </div>
                    ${state.editingProductId ? renderProductFormModal() : ''}
                    <div class="bg-white rounded-3xl border overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 uppercase text-slate-400 font-semibold"><tr><th class="p-4">Produk</th><th class="p-4">Harga</th><th class="p-4">Stok</th><th class="p-4 text-right">Aksi</th></tr></thead>
                            <tbody class="divide-y">
                                ${products.map(p => `
                                    <tr>
                                        <td class="p-4 flex items-center gap-3"><img src="${p.image}" class="w-10 h-10 rounded-lg object-cover"><span class="font-bold">${p.name}</span></td>
                                        <td class="p-4 font-bold">${formatRupiah(p.price)}</td>
                                        <td class="p-4">${p.stock}</td>
                                        <td class="p-4 text-right"><button onclick="deleteProduct('${p.id}')" class="px-3 py-1 bg-rose-50 text-rose-600 rounded-lg font-semibold">Hapus</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderProductFormModal() {
            return `
                <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl text-xs">
                        <h3 class="font-extrabold text-base">Tambah Produk Baru ke Supabase</h3>
                        <form onsubmit="handleSaveProduct(event)" class="space-y-3">
                            <div><label>Nama Produk</label><input type="text" id="p-name" required class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label>Kategori</label><input type="text" id="p-cat" required class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label>Harga (Rp)</label><input type="number" id="p-price" required class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label>Stok</label><input type="number" id="p-stock" required class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label>URL Gambar</label><input type="url" id="p-img" required class="w-full px-3 py-2 bg-slate-100 rounded-xl"></div>
                            <div><label>Deskripsi</label><textarea id="p-desc" class="w-full px-3 py-2 bg-slate-100 rounded-xl"></textarea></div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Simpan ke Supabase</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const newProd = {
                id: `PRD-${Math.floor(300 + Math.random() * 700)}`,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-cat').value,
                price: Number(document.getElementById('p-price').value),
                original_price: Number(document.getElementById('p-price').value) * 1.2,
                stock: Number(document.getElementById('p-stock').value),
                sold: 0,
                condition: 'Baru',
                rating: 5.0,
                seller: 'Admin PasarKita',
                location: 'Depok',
                is_flash_sale: false,
                image: document.getElementById('p-img').value,
                description: document.getElementById('p-desc').value
            };

            await supabaseClient.from('products').insert(newProd);
            state.editingProductId = null;
            showToast('Produk berhasil disimpan ke Supabase!');
            navigateTo('admin-dashboard');
        }

        async function deleteProduct(id) {
            if (confirm('Hapus produk dari Supabase?')) {
                await supabaseClient.from('products').delete().eq('id', id);
                showToast('Produk berhasil dihapus');
                navigateTo('admin-dashboard');
            }
        }

        // 9. DATABASE INSPECTOR VIEW
        async function renderDatabaseView() {
            const users = await DB.getUsers();
            const products = await DB.getProducts();
            const transactions = await DB.getTransactions();

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div class="bg-white p-6 rounded-3xl border shadow-xs">
                        <h1 class="font-extrabold text-xl">Supabase Database Inspector</h1>
                        <p class="text-xs text-slate-500">Melihat data secara langsung dari tabel PostgreSQL cloud.</p>
                    </div>
                    <div class="bg-slate-900 rounded-3xl p-6 text-emerald-400 font-mono text-xs overflow-x-auto shadow-xl">
                        <pre>${JSON.stringify({ users, products, transactions }, null, 2)}</pre>
                    </div>
                </div>
            `;
        }

        // INIT APP
        window.addEventListener('DOMContentLoaded', async () => {
            await DB.init();
            await navigateTo('home');
        });
    </script>
</body>
</html>
