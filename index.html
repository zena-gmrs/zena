        // DATABASE LAYER (SUPABASE)
        const DB = {
            async init() {
                try {

                    if (!prods || prods.length === 0) {
                        await supabaseClient.from('products').insert(DEFAULT_PRODUCTS);
                    }
                    const { data: usrs } = await supabaseClient.from('users').select('*');
                    if (!usrs || usrs.length === 0) {
                        await supabaseClient.from('users').insert(DEFAULT_USERS);
                    }
                    if (!localStorage.getItem('pasarkitagames_cart_v1')) {
                        localStorage.setItem('pasarkitagames_cart_v1', JSON.stringify([{ productId: 'PRD-ML-01', qty: 1, selected: true }]));
                    }
                    if (!localStorage.getItem('pasarkitagames_session_v1')) {
                        localStorage.setItem('pasarkitagames_session_v1', JSON.stringify(DEFAULT_USERS[0]));
                    }
                } catch (err) {
                    console.error('Gagal inisialisasi Supabase:', err);
                }
            },

            async getUsers() {
                const { data, error } = await supabaseClient.from('users').select('*');
                return error ? [] : data;
            },

            async getProducts() {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) return [];
                return data.map(p => ({
                    id: p.id,
                    name: p.name,
                    category: p.category,
                    price: p.price,
                    originalPrice: p.original_price,
                    stock: p.stock,
                    sold: p.sold,
                    condition: p.condition,
                    rating: p.rating,
                    seller: p.seller,
                    location: p.location,
                    isFlashSale: p.is_flash_sale,
                    image: p.image,
                    description: p.description
                }));
            },

            async getTransactions() {
                const { data, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
                if (error) return [];
                return data.map(t => ({
                    invoice: t.invoice,
                    userId: t.user_id,
                    customerName: t.customer_name,
                    phone: t.phone,
                    shippingAddress: t.shipping_address,
                    shippingMethod: t.shipping_method,
                    paymentMethod: t.payment_method,
                    items: t.items,
                    subtotal: t.subtotal,
                    shippingCost: t.shipping_cost,
                    discount: t.discount,
                    total: t.total,
                    status: t.status,
                    createdAt: t.created_at
                }));
            },

            async saveTransaction(tx) {
                await supabaseClient.from('transactions').insert({
                    invoice: tx.invoice,
                    user_id: tx.userId,
                    customer_name: tx.customerName,
                    phone: tx.phone,
                    shipping_address: tx.shippingAddress,
                    shipping_method: tx.shippingMethod,
                    payment_method: tx.paymentMethod,
                    items: tx.items,
                    subtotal: tx.subtotal,
                    shipping_cost: tx.shippingCost,
                    discount: tx.discount,
                    total: tx.total,
                    status: tx.status,
                    created_at: tx.createdAt
                });
            },

            getCart() { return JSON.parse(localStorage.getItem('pasarkitagames_cart_v1') || '[]'); },
            saveCart(data) { localStorage.setItem('pasarkitagames_cart_v1', JSON.stringify(data)); updateNavbarState(); },

            getSession() {
                const raw = localStorage.getItem('pasarkitagames_session_v1');
                return raw ? JSON.parse(raw) : null;
            },
            saveSession(user) {
                if (user) localStorage.setItem('pasarkitagames_session_v1', JSON.stringify(user));
                else localStorage.removeItem('pasarkitagames_session_v1');
                updateNavbarState();
            }
        };

            currentView: 'home',
            selectedProductId: null,
            detailQty: 1,
            catalogSearch: '',
            catalogCategory: 'Semua',
            paymentMethod: 'QRIS Instant (All Apps)',

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num || 0);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-rose-950 border-rose-700 text-rose-100' : 'bg-slate-900 border-slate-700 text-white';
            const dotColor = type === 'error' ? 'bg-rose-400' : 'bg-violet-400';
            toast.className = `${colors} px-4 py-3 rounded-xl shadow-xl border text-xs sm:text-sm font-medium flex items-center gap-2.5 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto max-w-sm`;
            toast.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getStatusBadge(status) {
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border bg-emerald-500/10 text-emerald-400 border-emerald-500/20">${status}</span>`;
        }

        async function navigateTo(view, params = {}) {
            state.currentView = view;
            if (params.productId) { state.selectedProductId = params.productId; state.detailQty = 1; }
            if (params.category) state.catalogCategory = params.category;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateNavbarState();
            await renderCurrentView();
        }

        function updateNavbarState() {
            document.querySelectorAll('.nav-link').forEach(el => {
                const target = el.dataset.nav;
                if (target === state.currentView) {
                    el.classList.add('bg-slate-800', 'text-violet-400', 'shadow-xs');
                    el.classList.remove('text-slate-300');
                } else {
                    el.classList.remove('bg-slate-800', 'text-violet-400', 'shadow-xs');
                    el.classList.add('text-slate-300');
                }
            });

            const cart = DB.getCart();
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('nav-cart-badge');
            if (badge) badge.textContent = totalQty;

            const session = DB.getSession();
            const authArea = document.getElementById('nav-auth-area');
            if (authArea) {
                if (session) {
                    authArea.innerHTML = `

                }
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

            const users = await DB.getUsers();
            const admin = users.find(u => u.role === 'admin') || users[1];
            DB.saveSession(admin);
            showToast('Beralih ke Admin Store Games');
            navigateTo('admin-dashboard');

        function handleLogout() {
            DB.saveSession(null);
            showToast('Berhasil keluar');
            navigateTo('home');

        async function renderCurrentView() {
            const root = document.getElementById('app-root');
            if (!root) return;

            switch (state.currentView) {
                case 'home': root.innerHTML = await renderHomeView(); break;
                case 'catalog': root.innerHTML = await renderCatalogView(); break;
                case 'product-detail': root.innerHTML = await renderProductDetailView(); break;
                case 'customer-dashboard': root.innerHTML = await renderCustomerDashboardView(); break;
                case 'admin-dashboard': root.innerHTML = await renderAdminDashboardView(); break;
                case 'database': root.innerHTML = await renderDatabaseView(); break;
                default: root.innerHTML = await renderHomeView(); break;
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // 1. HOME VIEW

                            <div class="relative z-10 max-w-xl space-y-4 text-center md:text-left">
                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/20 border border-violet-400/30 text-violet-300 text-xs font-semibold">
                                    <i data-lucide="zap" class="w-3.5 h-3.5"></i> Proses Kilat 1 Detik • Legal 100%
                                </div>
                                <h1 class="font-display font-extrabold text-3xl sm:text-5xl tracking-tight leading-tight">
                                    Top Up Diamond & Voucher <span class="text-violet-400">Game Termurah</span>
                                </h1>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                    Pusat top-up game online terlengkap dengan pembayaran instan QRIS, E-Wallet, dan Transfer Bank.
                                </p>
                                <button onclick="navigateTo('catalog')" class="px-6 py-3 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-display font-bold text-xs shadow-lg shadow-violet-600/30 transition-all">Pilih Game Sekarang</button>
                            </div>
                            <div class="relative z-10 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl border border-violet-500/20">

        function renderGameCard(p) {

                                <span class="text-[10px] text-slate-500 line-through">${formatRupiah(p.originalPrice || p.price * 1.1)}</span>
                            </div>
                            <button onclick="navigateTo('product-detail', {productId: '${p.id}'})" class="px-3 py-2 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold shadow-md">Beli</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. CATALOG VIEW
        async function renderCatalogView() {
            const products = await DB.getProducts();
            const categories = ['Semua', ...new Set(products.map(p => p.category))];
            const filtered = products.filter(p => state.catalogCategory === 'Semua' || p.category === state.catalogCategory);

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <h1 class="font-display font-extrabold text-2xl text-white">Katalog Game & Voucher</h1>
                    <div class="flex flex-wrap gap-2">
                        ${categories.map(cat => `<button onclick="state.catalogCategory = '${cat}'; renderCurrentView();" class="px-4 py-2 rounded-xl text-xs font-semibold ${state.catalogCategory === cat ? 'bg-violet-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-300'}">${cat}</button>`).join('')}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        ${filtered.map(p => renderGameCard(p)).join('')}
                    </div>
                </div>
            `;
        }

        // 3. PRODUCT DETAIL & INPUT USER ID GAME
        async function renderProductDetailView() {
            const products = await DB.getProducts();
            const p = products.find(prod => prod.id === state.selectedProductId) || products[0];

            return `
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <button onclick="navigateTo('catalog')" class="text-xs text-slate-400 hover:text-violet-400 flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</button>
                    
                    <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="space-y-4">
                            <img src="${p.image}" class="w-full aspect-video rounded-2xl object-cover border border-slate-800">
                            <h2 class="font-display font-bold text-lg text-white">${p.name}</h2>
                            <p class="text-xs text-slate-400 leading-relaxed">${p.description}</p>
                            <div class="font-display font-extrabold text-2xl text-violet-400">${formatRupiah(p.price)}</div>
                        </div>

                        <div class="md:col-span-2 space-y-6 bg-slate-950 p-6 rounded-2xl border border-slate-800">
                            <h3 class="font-display font-bold text-sm text-white flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-violet-600 text-white flex items-center justify-center text-xs">1</span> Masukkan Data Akun Game</h3>
                            <div class="grid grid-cols-2 gap-4 text-xs">
                                <div><label class="block text-slate-400 mb-1">User ID / UID</label><input type="text" id="input-game-id" placeholder="Contoh: 12345678" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white"></div>
                                <div><label class="block text-slate-400 mb-1">Server / Zone ID</label><input type="text" id="input-game-server" placeholder="Contoh: (1234)" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white"></div>
                            </div>

                            <h3 class="font-display font-bold text-sm text-white flex items-center gap-2 pt-4"><span class="w-6 h-6 rounded-full bg-violet-600 text-white flex items-center justify-center text-xs">2</span> Pilih Pembayaran</h3>
                            <div class="space-y-2 text-xs">
                                ${['QRIS Instant (All Apps)', 'Transfer Bank BCA', 'GoPay / OVO / Dana'].map(pay => `
                                    <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer">
                                        <span class="font-bold text-white">${pay}</span>
                                        <input type="radio" name="pay-method" ${state.paymentMethod===pay?'checked':''} onclick="state.paymentMethod='${pay}'" class="text-violet-600">
                                    </label>
                                `).join('')}
                            </div>

                            <button onclick="processTopUp('${p.id}', '${p.name}', ${p.price})" class="w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-display font-bold text-xs rounded-xl shadow-lg shadow-violet-600/30">Top Up Sekarang</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function processTopUp(prodId, prodName, price) {
            const gameId = document.getElementById('input-game-id').value.trim();
            const serverId = document.getElementById('input-game-server').value.trim();

            if (!gameId) {
                showToast('Mohon masukkan User ID game Anda!', 'error');
                return;
            }

            const session = DB.getSession() || (await DB.getUsers())[0];
            const newTx = {
                invoice: `INV-GAME-${Math.floor(1000 + Math.random() * 9000)}`,
                userId: session.id,
                customerName: session.name,
                phone: session.phone || '0812345678',
                shippingAddress: `UID: ${gameId} (${serverId || 'No Server'})`,
                shippingMethod: 'Instant Game Delivery',
                paymentMethod: state.paymentMethod,
                items: [{ id: prodId, name: prodName, price, qty: 1, image: '' }],
                subtotal: price,
                shippingCost: 0,
                discount: 0,
                total: price,
                status: 'Sukses (Masuk Otomatis)',
                createdAt: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };

            await DB.saveTransaction(newTx);
            showToast('Top Up Berhasil! Item telah dikirim ke akun game Anda.');
            navigateTo('customer-dashboard');
        }

        // 4. CUSTOMER DASHBOARD
        async function renderCustomerDashboardView() {
            const session = DB.getSession() || (await DB.getUsers())[0];
            const transactions = await DB.getTransactions();
            const userTxs = transactions.filter(t => t.userId === session.id);

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 flex items-center justify-between">
                        <div><h1 class="font-extrabold text-xl text-white">${session.name}</h1><p class="text-xs text-slate-400">${session.email}</p></div>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-rose-500/10 text-rose-400 font-semibold text-xs rounded-xl">Keluar</button>
                    </div>
                    <div class="space-y-4">
                        <h2 class="font-bold text-lg text-white">Riwayat Transaksi Top Up Game</h2>
                        ${userTxs.length === 0 ? `<div class="bg-slate-900 p-12 rounded-2xl border border-slate-800 text-center text-xs text-slate-400">Belum ada riwayat top up.</div>` : userTxs.map(t => `
                            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xs space-y-3 text-xs">
                                <div class="flex justify-between font-bold text-white"><span>${t.invoice}</span>${getStatusBadge(t.status)}</div>
                                <div class="text-slate-400">Akun / UID: <span class="text-violet-400 font-semibold">${t.shippingAddress}</span></div>
                                <div class="text-slate-400">Total Bayar: <span class="font-bold text-white">${formatRupiah(t.total)}</span> (${t.createdAt})</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 5. ADMIN DASHBOARD
        async function renderAdminDashboardView() {
            const products = await DB.getProducts();

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                    <div class="flex justify-between items-center">
                        <h1 class="font-extrabold text-xl text-white">Admin Panel Store Games (Supabase)</h1>
                        <button onclick="state.editingProductId = 'new'; renderCurrentView();" class="px-4 py-2 bg-violet-600 text-white rounded-xl text-xs font-bold">+ Tambah Item Game</button>
                    </div>
                    ${state.editingProductId ? renderProductFormModal() : ''}
                    <div class="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 uppercase text-slate-400 font-semibold"><tr><th class="p-4">Game / Item</th><th class="p-4">Harga</th><th class="p-4">Stok</th><th class="p-4 text-right">Aksi</th></tr></thead>
                            <tbody class="divide-y divide-slate-800">
                                ${products.map(p => `
                                    <tr>
                                        <td class="p-4 flex items-center gap-3"><img src="${p.image}" class="w-10 h-10 rounded-lg object-cover"><span class="font-bold text-white">${p.name}</span></td>
                                        <td class="p-4 font-bold text-violet-400">${formatRupiah(p.price)}</td>
                                        <td class="p-4 text-slate-300">${p.stock}</td>
                                        <td class="p-4 text-right"><button onclick="deleteProduct('${p.id}')" class="px-3 py-1 bg-rose-500/10 text-rose-400 rounded-lg font-semibold">Hapus</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderProductFormModal() {
            return `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-4">
                    <div class="bg-slate-900 w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl border border-slate-800 text-xs text-white">
                        <h3 class="font-extrabold text-base">Tambah Item Game Baru</h3>
                        <form onsubmit="handleSaveProduct(event)" class="space-y-3">
                            <div><label>Nama Item (Cth: 172 Diamond)</label><input type="text" id="p-name" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></div>
                            <div><label>Game (Cth: Mobile Legends)</label><input type="text" id="p-cat" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></div>
                            <div><label>Harga (Rp)</label><input type="number" id="p-price" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></div>
                            <div><label>URL Gambar Banner</label><input type="url" id="p-img" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></div>
                            <button type="submit" class="w-full py-3 bg-violet-600 text-white font-bold rounded-xl">Simpan ke Supabase</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const newProd = {
                id: `PRD-GAME-${Math.floor(300 + Math.random() * 700)}`,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-cat').value,
                price: Number(document.getElementById('p-price').value),
                original_price: Number(document.getElementById('p-price').value) * 1.1,
                stock: 999,
                sold: 0,
                condition: 'Instant',
                rating: 5.0,
                seller: 'Official Store',
                location: 'Global',
                is_flash_sale: true,
                image: document.getElementById('p-img').value,
                description: 'Top up instan otomatis masuk.'
            };

            await supabaseClient.from('products').insert(newProd);
            state.editingProductId = null;
            showToast('Item game berhasil ditambahkan!');
            navigateTo('admin-dashboard');
        }

        async function deleteProduct(id) {
            if (confirm('Hapus item game ini?')) {
                await supabaseClient.from('products').delete().eq('id', id);
                showToast('Item berhasil dihapus');
                navigateTo('admin-dashboard');
            }
        }

        // 6. DATABASE INSPECTOR VIEW
        async function renderDatabaseView() {
            const users = await DB.getUsers();
            const products = await DB.getProducts();
            const transactions = await DB.getTransactions();

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                        <h1 class="font-extrabold text-xl text-white">Supabase Game DB Inspector</h1>
                        <p class="text-xs text-slate-400">Inspeksi data real-time database store top up.</p>
                    </div>
                    <div class="bg-slate-900 rounded-3xl p-6 text-violet-400 font-mono text-xs overflow-x-auto border border-slate-800">
                        <pre>${JSON.stringify({ users, products, transactions }, null, 2)}</pre>
                    </div>
                </div>
            `;
        }

        // INIT APP
        window.addEventListener('DOMContentLoaded', async () => {
            await DB.init();
            await navigateTo('home');
        });
    </script>
</body>
</html>
